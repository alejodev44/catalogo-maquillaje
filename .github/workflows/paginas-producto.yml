name: Páginas de producto

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paginas-producto
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar páginas y sitemap
        run: node scripts/generar-paginas-producto.mjs .

      - name: Subir cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar páginas de producto y sitemap"
            git push
          fi
